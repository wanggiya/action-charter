name: actioncharter

x-agent: &agent
  build:
    context: .
    dockerfile: docker/agent/Dockerfile
  image: ${AGENT_IMAGE:-geoagent-agent:local}
  restart: "no"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &model-environment
    MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
    MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
    MODEL_NAME: ${MODEL_NAME:-qwen3:4b-instruct}
    MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-120}
    MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-1024}
  networks: [model]
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  planner:
    <<: *agent
    working_dir: /workspace
    command:
      - plan-task
      - --request
      - >-
        Inspect data/input/sample_points.geojson, plan loading it into
        the agent_sandbox PostGIS schema, deterministically validate it,
        and generate a Markdown report. Plan only; do not execute.
      - --project-root
      - /workspace
      - --agents-root
      - /app/agents
      - --pretty
    volumes:
      - ./agents/planner:/app/agents/planner:ro
      - ./context:/workspace/context:ro
    profiles: [agents]

  builder:
    <<: *agent

    working_dir: /workspace

    command:
      - builder-propose
      - --request-file
      - /workspace/request/example-adapter.json
      - --request-root
      - /workspace/request
      - --agents-root
      - /app/agents
      - --pretty

    volumes:
      - ./agents/builder:/app/agents/builder:ro
      - ./builder-requests/example-adapter.json:/workspace/request/example-adapter.json:ro

    profiles:
      - agents

  executor:
    <<: *agent
    command: ["agent-info", "executor"]

    environment:
      GEOAGENT_MCP_URL: http://mcp-gis:8000/mcp
      GEOAGENT_MCP_TIMEOUT_SECONDS: 30
      GEOAGENT_STATE_ROOT: /workspace/workflow-state

    extra_hosts: []

    networks:
      - control

    volumes:
      - ./agents/executor:/app/agents/executor:ro
      - ./context:/workspace/context:ro
      - ./plans:/workspace/plans:ro
      - ./approvals:/workspace/approvals:ro
      - ./workflow-recipes:/workspace/workflow-recipes:ro
      - ./workflow-state:/workspace/workflow-state:ro

    profiles:
      - agents

  workflow-runner:
    build:
      context: .
      dockerfile: docker/workflow-runner/Dockerfile
      args:
        GEOAGENT_UID: ${GEOAGENT_HOST_UID:-1000}
        GEOAGENT_GID: ${GEOAGENT_HOST_GID:-1000}

    image: ${WORKFLOW_IMAGE:-geoagent-workflow-runner:local}

    working_dir: /workspace/snakemake-exports

    entrypoint:
      - snakemake

    command:
      - --help

    # user: "${GEOAGENT_HOST_UID:-1000}:${GEOAGENT_HOST_GID:-1000}"

    environment:
      GEOAGENT_MCP_URL: http://mcp-gis:8000/mcp
      GEOAGENT_MCP_TIMEOUT_SECONDS: 30

      GEOAGENT_PROJECT_ROOT: /workspace
      GEOAGENT_AGENTS_ROOT: /app/agents
      GEOAGENT_RECIPE_ROOT: /workspace/workflow-recipes
      GEOAGENT_APPROVAL_ROOT: /workspace/approvals
      GEOAGENT_SNAKEMAKE_EXPORT_ROOT: /workspace/snakemake-exports

      HOME: /tmp/geoagent-home
      XDG_CACHE_HOME: /tmp/geoagent-cache
      XDG_CONFIG_HOME: /tmp/geoagent-config
      XDG_DATA_HOME: /tmp/geoagent-data
      TMPDIR: /tmp

    extra_hosts: []

    networks:
      - control

    volumes:
      - ./agents/executor:/app/agents/executor:ro
      - ./context:/workspace/context:ro
      - ./approvals:/workspace/approvals:ro
      - ./workflow-recipes:/workspace/workflow-recipes:ro
      - ./snakemake-exports:/workspace/snakemake-exports

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    profiles:
      - workflow

  critic:
    <<: *agent

    command:
      - agent-info
      - critic

    working_dir: /workspace

    volumes:
      - ./agents/critic:/app/agents/critic:ro
      - ./context:/workspace/context:ro
      - ./traces:/workspace/traces:ro
      - ./reports:/workspace/reports:ro

    profiles:
      - agents

  mcp-gis:
    build:
      context: .
      dockerfile: docker/gis-tools/Dockerfile

    image: ${GIS_IMAGE:-geoagent-gis-tools:local}

    working_dir: /workspace

    command: ["geoagent-mcp"]

    environment:
      GEOAGENT_WORKSPACE: /workspace
      GEOAGENT_PROJECT_ROOT: /workspace
      GEOAGENT_INPUT_ROOT: /workspace/data/input
      GEOAGENT_SPATIAL_CONTRACT_ROOT: /workspace/spatial-contracts
      GEOAGENT_OUTPUT_ROOT: /workspace/data/output
      
      GEOAGENT_RECIPE_ROOT: /workspace/workflow-recipes
      GEOAGENT_RECIPE_RUN_ROOT: /workspace/recipe-runs
      GEOAGENT_RECIPE_EVIDENCE_ROOT: /workspace/recipe-evidence

      GEOAGENT_PLAN_ROOT: /workspace/plans
      GEOAGENT_APPROVAL_ROOT: /workspace/approvals
      GEOAGENT_TRACE_ROOT: /workspace/traces
      GEOAGENT_REPORT_ROOT: /workspace/reports
      GEOAGENT_CONTAINER_IMAGE: ${GIS_IMAGE:-geoagent-gis-tools:local}

      GEOAGENT_MCP_TRANSPORT: streamable-http
      GEOAGENT_MCP_HOST: 0.0.0.0
      GEOAGENT_MCP_PORT: 8000
      GEOAGENT_MCP_PATH: /mcp

      

      ENABLE_WRITE_TOOLS: ${ENABLE_WRITE_TOOLS:-false}
      ALLOW_OVERWRITE: ${ALLOW_OVERWRITE:-false}
      ALLOWED_SCHEMAS: ${ALLOWED_SCHEMAS:-agent_sandbox}

      POSTGRES_HOST: ${POSTGRES_HOST:-postgis}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-geoagent}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgis_password

    volumes:
      - ./data/input:/workspace/data/input:ro
      - ./benchmarks/spatial-contracts/vector:/workspace/spatial-contracts:ro
      - ./traces:/workspace/traces
      - ./reports:/workspace/reports
      - ./plans:/workspace/plans:ro
      - ./approvals:/workspace/approvals:ro
      - ./workflow-recipes:/workspace/workflow-recipes:ro
      - ./context:/workspace/context:ro
      - ./data/output:/workspace/data/output
      - ./recipe-runs:/workspace/recipe-runs
      - ./recipe-evidence:/workspace/recipe-evidence

    networks:
      - control
      - backend
    
    secrets:
      - postgis_password

    profiles:
      - tools

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    expose:
      - "8000"

  skill-test-runner:
    build:
      context: .
      dockerfile: docker/skill-test-runner/Dockerfile

    image: ${SKILL_TEST_IMAGE:-geoagent-skill-test:local}

    working_dir: /candidate

    environment:
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    network_mode: none

    read_only: true

    tmpfs:
      - /tmp:size=128m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 128

    volumes:
      - ${SKILL_CANDIDATE_DIR:-./skill-candidates}:/candidate:ro

    profiles:
      - skill-testing

networks:
  control:
    internal: true
  model:
  backend:
    external: true
    name: ${GEOAGENT_BACKEND_NETWORK:-geoagent-backend}

secrets:
  postgis_password:
    file: ./.secrets/postgis_password
