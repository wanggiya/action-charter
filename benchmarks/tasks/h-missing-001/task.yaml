schema_version: '1.0'
id: h-missing-001
workload: H
title: Inspect encounters.csv and return missing counts for weight and payer. No writes.
request: Inspect encounters.csv and return missing counts for weight and payer. No
  writes.
inputs:
- input/encounters.csv
data_class: raw
