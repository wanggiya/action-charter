schema_version: '1.0'
id: h-regression-001
workload: H
title: Fit linear regression of y on x in measures.csv with an intercept. Return coefficients,
  standard errors, p-values and R-squared. No writes.
request: Fit linear regression of y on x in measures.csv with an intercept. Return
  coefficients, standard errors, p-values and R-squared. No writes.
inputs:
- input/measures.csv
data_class: raw
write_mode: read_only
runtime: local
requires_local_data: false
expected:
  kind: deterministic
  checks:
  - type: value_close
    field: table_analysis.statistics.regression.coefficients.0.coefficient
    expected: 1.3
    tolerance: 1.0e-09
  - type: value_close
    field: table_analysis.statistics.regression.coefficients.1.coefficient
    expected: 1.3
    tolerance: 1.0e-09
  - type: value_close
    field: table_analysis.statistics.regression.coefficients.1.standard_error
    expected: 0.17320508075688773
    tolerance: 1.0e-09
  - type: value_close
    field: table_analysis.statistics.regression.coefficients.1.p_value
    expected: 0.017292370176009153
    tolerance: 1.0e-09
  - type: value_close
    field: table_analysis.statistics.regression.r_squared
    expected: 0.9657142857142857
    tolerance: 1.0e-09
limits:
  wall_clock_s: 120
  model_calls: 3
