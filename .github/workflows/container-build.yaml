name: container-build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and contract-test ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            dockerfile: docker/agent/Dockerfile

          - name: gis-tools
            dockerfile: docker/gis-tools/Dockerfile

          - name: skill-test-runner
            dockerfile: docker/skill-test-runner/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          platforms: linux/amd64
          tags: geoagent-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Verify non-root image user
        run: |
          test "$(
            docker image inspect \
              "geoagent-${{ matrix.name }}:ci" \
              --format '{{.Config.User}}'
          )" = "geoagent"

      - name: Verify agent CLI starts
        if: matrix.name == 'agent'
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:size=16m,mode=1777 \
            "geoagent-${{ matrix.name }}:ci" \
            --help

      - name: Verify all agent manifests
        if: matrix.name == 'agent'
        run: |
          for agent_id in planner executor critic
          do
            docker run --rm \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --tmpfs /tmp:size=16m,mode=1777 \
              --volume "$GITHUB_WORKSPACE/agents:/app/agents:ro" \
              "geoagent-${{ matrix.name }}:ci" \
              agent-info "$agent_id" \
              --agents-root /app/agents
          done

      - name: Validate recipe catalog inside agent image
        if: matrix.name == 'agent'
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:size=16m,mode=1777 \
            --workdir /workspace \
            --volume "$GITHUB_WORKSPACE/context:/workspace/context:ro" \
            "geoagent-${{ matrix.name }}:ci" \
            recipe-template-catalog \
            --project-root /workspace

      - name: Verify GIS CLI starts
        if: matrix.name == 'gis-tools'
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:size=16m,mode=1777 \
            --entrypoint geoagent \
            "geoagent-${{ matrix.name }}:ci" \
            --help

      - name: Inspect vector inside GIS image
        if: matrix.name == 'gis-tools'
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:size=16m,mode=1777 \
            --volume "$GITHUB_WORKSPACE/data/input:/workspace/data/input:ro" \
            --entrypoint geoagent \
            "geoagent-${{ matrix.name }}:ci" \
            inspect-vector \
            /workspace/data/input/sample_points.geojson \
            --input-root /workspace/data/input \
            --pretty

      - name: Inspect raster inside GIS image
        if: matrix.name == 'gis-tools'
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:size=16m,mode=1777 \
            --volume "$GITHUB_WORKSPACE/data/input:/workspace/data/input:ro" \
            --entrypoint geoagent \
            "geoagent-${{ matrix.name }}:ci" \
            inspect-raster \
            /workspace/data/input/sample_dem.tif \
            --input-root /workspace/data/input \
            --pretty

      - name: Plan raster conversion without writing
        if: matrix.name == 'gis-tools'
        run: |
          output_root="$RUNNER_TEMP/geoagent-raster-output"

          mkdir -p "$output_root"
          chmod 0755 "$output_root"

          output="$(
            docker run --rm \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --tmpfs /tmp:size=16m,mode=1777 \
              --volume "$GITHUB_WORKSPACE/data/input:/workspace/data/input:ro" \
              --volume "$output_root:/workspace/data/output" \
              --entrypoint geoagent \
              "geoagent-${{ matrix.name }}:ci" \
              plan-convert-raster \
              /workspace/data/input/sample_dem.tif \
              /workspace/data/output/ci_result.tif \
              --target-crs EPSG:3857 \
              --input-root /workspace/data/input \
              --output-root /workspace/data/output
          )"

          printf '%s\n' "$output"

          printf '%s\n' "$output" \
            | jq -e '
                .status == "planned_not_executed"
                and .target_driver == "GTiff"
                and .target_crs == "EPSG:3857"
                and .overwrite == false
                and .execution_allowed == false
                and .approval_required == true
                and .validation_required == true
              '

          test ! -e "$output_root/ci_result.tif"

      - name: Reject raster path escape
        if: matrix.name == 'gis-tools'
        run: |
          set +e

          output="$(
            docker run --rm \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --tmpfs /tmp:size=16m,mode=1777 \
              --volume "$GITHUB_WORKSPACE/data/input:/workspace/data/input:ro" \
              --entrypoint geoagent \
              "geoagent-${{ matrix.name }}:ci" \
              inspect-raster \
              /etc/passwd \
              --input-root /workspace/data/input \
              2>&1
          )"

          status=$?

          set -e

          printf '%s\n' "$output"

          test "$status" -ne 0

          case "$output" in
            *"raster inspection request failed policy"*)
              ;;
            *)
              echo "Expected controlled raster policy rejection"
              exit 1
              ;;
          esac

      - name: Verify skill-test runner fails closed
        if: matrix.name == 'skill-test-runner'
        run: |
          set +e

          output="$(
            docker run --rm \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --pids-limit 128 \
              --tmpfs /tmp:size=128m,mode=1777 \
              "geoagent-${{ matrix.name }}:ci" \
              2>&1
          )"

          status=$?

          set -e

          printf '%s\n' "$output"

          test "$status" -ne 0

          case "$output" in
            *"candidate source package is missing"*)
              ;;
            *)
              echo "Expected missing-candidate rejection"
              exit 1
              ;;
          esac

  compose-contract:
    name: Validate Compose contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate complete Compose configuration
        run: |
          docker compose \
            --profile agents \
            --profile tools \
            --profile skill-testing \
            config --quiet