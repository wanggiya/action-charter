name: container-build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: container-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            dockerfile: docker/agent/Dockerfile

          - name: gis-tools
            dockerfile: docker/gis-tools/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          platforms: linux/amd64
          tags: geoagent-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Verify non-root image user
        run: |
          test "$(
            docker image inspect \
              "geoagent-${{ matrix.name }}:ci" \
              --format '{{.Config.User}}'
          )" = "geoagent"

      - name: Smoke-test agent CLI
        if: matrix.name == 'agent'
        run: |
          docker run --rm \
            "geoagent-${{ matrix.name }}:ci" \
            --help

      - name: Smoke-test GIS image CLI
        if: matrix.name == 'gis-tools'
        run: |
          docker run --rm \
            --entrypoint geoagent \
            "geoagent-${{ matrix.name }}:ci" \
            --help