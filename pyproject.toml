[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "actioncharter"
version = "0.9.0"
description = "Governed execution harness for AI agents using professional tools"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Jay Qi" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]
dependencies = [
  "geoalchemy2>=0.15,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
gis = [
  "geopandas>=1.0,<2",
  "numpy>=1.26,<2",
  "pyogrio>=0.9,<1",
  "rasterio>=1.4,<2",
]
dev = [
  "geopandas>=1.0,<2",
  "mcp[cli]>=1.29,<1.30",
  "numpy>=1.26,<2",
  "pyogrio>=0.9,<1",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "rasterio>=1.4,<2",
]

mcp = [
  "mcp>=1.29,<1.30",
]

workflow = [
  "snakemake>=9.25,<9.26",
]

[project.scripts]
geoagent = "geoagent_harness.cli:app"
geoagent-mcp = "geoagent_harness.mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/wanggiya/action-charter"
Repository = "https://github.com/wanggiya/action-charter"
Issues = "https://github.com/wanggiya/action-charter/issues"
Documentation = "https://github.com/wanggiya/action-charter#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/geoagent_harness"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["geoagent_harness"]
