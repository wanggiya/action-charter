[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geoagent-skill-harness"
version = "0.1.0"
description = "CLI-first, local-first harness for validated geospatial agent skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "geoalchemy2>=0.15,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
gis = [
  "geopandas>=1.0,<2",
  "pyogrio>=0.9,<1",
]
dev = [
  "geopandas>=1.0,<2",
  "mcp[cli]>=1.29,<1.30",
  "pyogrio>=0.9,<1",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
]

mcp = [
  "mcp>=1.29,<1.30",
]

[project.scripts]
geoagent = "geoagent_harness.cli:app"
geoagent-mcp = "geoagent_harness.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geoagent_harness"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["geoagent_harness"]
